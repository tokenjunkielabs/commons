name: Submit existing Quittance contributions

on:
  push:
    branches: [delivery/quittance-publication-reset-20261004-75a1]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit the original named operations
        env:
          PUBLISHING_OPERATION_TOKEN: ${{ secrets.COMMONS_GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const queue = [
            {
              "operation_id": "quittance584-create-20261004-ledger0938",
              "operation": "pull.create",
              "args": {
                "owner": "Quittance-Labs",
                "repo": "Quittance0",
                "base": "main",
                "head": "woahwhattheheck:feat/q584-signed-webhooks-ledger0938",
                "title": "Add signed seller webhooks with an atomic outbox and durable retries",
                "body": "## Problem\n\nSellers currently have to poll the dashboard for invoice changes. Cancellation and expiry also lack payment audit events, so an external accounting or fulfillment system cannot reliably follow the invoice lifecycle.\n\n## Change\n\nAdds signed, at-least-once seller webhooks for `invoice.created`, `invoice.paid`, `invoice.cancelled`, `invoice.expired`, and `payment.rejected`.\n\n- PostgreSQL triggers enqueue in the same transaction as invoice changes and rejection audit writes, including the existing settlement CTE. Cancel/expiry now record audit events. Memory storage prepares fallible outbox work before mutating invoices, audit state, or payment claims.\n- Workers claim due delivery and endpoint rows with `FOR UPDATE SKIP LOCKED`, hold claims through a bounded attempt, and reuse the monitor's backoff with jitter. Retries preserve event IDs; attempt limits produce dead letters and repeated endpoint failures disable delivery.\n- HMAC-SHA256 covers the timestamp and raw body. Secrets are shown once, hashed and encrypted at rest; rotation retains the old signature for a 24-hour overlap.\n- Registration and each send validate public HTTPS destinations, recheck all DNS answers, pin the approved address while retaining TLS hostname checks, and refuse redirects. Payloads use an explicit privacy whitelist.\n- Wallet proofs bind each management action, seller, endpoint, filters, timestamp, and single-use nonce. The dashboard adds registration, removal, rotation, test delivery, and recent history, with stale wallet/network responses discarded.\n- Verification records rejection audit/outbox data before caching its verdict. A failed write returns a retryable 503 instead of silently losing the event.\n- All three server entrypoints start and stop the worker with the server. `docs/WEBHOOKS.md` documents deployment, receiver verification, the signature vector, deduplication, and operational limits.\n\n## Validation\n\nSource: `77b18245e9d694a3b0a09900e36b2ecd3618b1c1`. Normal lockfile-based installs; Node 24.21.0 / npm 11.19.0.\n\n- **16/16 webhook acceptance tests**, including real PostgreSQL 16.15 rollback, two separate worker processes, SIGKILL/restart recovery, an actual HTTP receiver returning 500/500/200, SSRF checks, signature rotation, signed API management, and the rejection/outbox cache boundary.\n- **904/904 backend catalog tests** and backend typecheck.\n- **760/760 frontend catalog tests**, frontend lint and typecheck.\n- **41/41 shared contract tests**.\n\n[Webhook/PostgreSQL, frontend, and shared run](https://github.com/woahwhattheheck/bounty-concierge/actions/runs/37204455112) tested `977da14c`. Its sole backend failure was an existing test expecting HTTP 404 from an unavailable Horizon endpoint. The only subsequent change supplies a real local HTTP 404 fixture; it retains the same assertion and changes no production code. [The final backend run](https://github.com/woahwhattheheck/bounty-concierge/actions/runs/37204940133) passes the complete catalog at `77b18245`.\n\nDelivery is at least once, so receivers must atomically deduplicate the stable event ID. Memory mode is process-local; durable deployment requires PostgreSQL and a stable server-only encryption key.\n\nCloses #584.\n",
                "draft": false,
                "maintainer_can_modify": true
              },
              "expected_head_sha": "77b18245e9d694a3b0a09900e36b2ecd3618b1c1",
              "issue": 584,
              "expected_issue_updated_at": "2026-10-03T12:57:40Z",
              "expected_issue_comments": 2
            },
            {
              "operation_id": "quittance585-create-20261004-ledger0938",
              "operation": "pull.create",
              "args": {
                "owner": "Quittance-Labs",
                "repo": "Quittance0",
                "base": "main",
                "head": "woahwhattheheck:feat/q585-monitor-payment-parity-ledger0938",
                "title": "Align monitor and wallet with path payments and pending claimable balances",
                "body": "Closes #585.\n\nThe backend monitor previously filtered out path payments and rebuilt each observed payment as one synthetic operation. That could disagree with manual verification, lose the delivered credit asset, and incorrectly accept the first payment in an ambiguous transaction. Claimable balances also never reached the seller's event feed.\n\n## Changes\n\n- Poll the account operations feed while retaining existing operation paging tokens. Normalize ordinary, strict-send and strict-receive payments using destination amount/code/issuer.\n- Reuse the observed transaction envelope and fetch its complete operation list once per candidate transaction. Run the same `verifyHorizonPayment` as POST verify; preserve multi-operation selection, ledger settlement time and per-record checkpoints.\n- Observe claimable-balance creation for the seller, resolve its immutable balance ID from creation effects, and log `CLAIMABLE_BALANCE_RECEIVED` with amount, asset and predicate. The invoice stays pending. Memory storage and a PostgreSQL partial unique index deduplicate cursor replay.\n- Give account creation/merge an explicit shared rejection code. Show claim information in the seller feed; accept path payments in the wallet stream with one received notification per operation.\n- Preserve existing monitor fixtures through a test-only full-transaction source helper and document the actual Horizon field mapping.\n\n## Validation\n\nBoth packages installed from their existing lockfiles with `npm ci`; neither lockfile changed.\n\n- Backend: 103 focused verifier/monitor/server tests passed, plus 22 existing cancellation/attribution tests passed (125 total; no skips).\n- Frontend: 16 payment-stream, event-rendering and rejection-label tests passed with locked dependencies.\n- Backend and frontend TypeScript checks passed.\n- The new acceptance suite drives the actual Horizon service mapping, monitor, memory storage and HTTP POST verify route. It covers every existing USDC fixture, more than ten operations, ambiguous seller payments, both unsupported operation types, claimable replay/restart and missing creation effects.\n\nThe focused commands and fixture interpretation are in [PAYMENT_MONITOR.md](docs/PAYMENT_MONITOR.md).\n\n## Public Testnet evidence\n\nThe committed [receipt bundle](backend/tests/fixtures/monitor-testnet-receipts.json) retains 15 exact public HTTP response bodies with URLs, capture timestamps, byte counts and SHA-256 hashes. It includes real strict-send, strict-receive, native claimable and USDC claimable transactions. The tests consume unchanged strict-receive and memo-bearing claimable envelopes against constructed test invoices.\n\nThe strict-send capture has **no memo**. Its unchanged destination mapping is tested separately from an explicitly synthetic memo-bearing derivative. The legacy path rows also remain labeled synthetic. No live Quittance invoice or newly submitted transaction is asserted.\n\n## PostgreSQL rollout and acceptance\n\nApply `db/schema.sql` before enabling this monitor so `payment_events_claimable_balance_unique` exists. The `claimable-event-postgres.integration.test.ts` acceptance checks concurrent writers, schema replay and a fresh connection in its own schema when `DATABASE_URL` is provided.\n\nThis check passed on implementation head `66f18e99a62c8373b5e487100d99f49368e2576f` in [native run 37204455112, job 111442631510](https://github.com/woahwhattheheck/bounty-concierge/actions/runs/37204455112/job/111442631510), using Node 24.21.0, npm 11.19.0 and PostgreSQL 16.15. Result: **1 test passed, 0 failed, 0 skipped**; 93.757396 ms test time, 413.141959 ms total. Command, from `backend` with the isolated runner database configured:\n\n```sh\nnode --import tsx --test tests/claimable-event-postgres.integration.test.ts\n```\n\nThe combined workflow subsequently failed in a separate Q584 Horizon 404 fixture. The Q585 PostgreSQL acceptance step itself succeeded.\n",
                "draft": false,
                "maintainer_can_modify": true
              },
              "expected_head_sha": "b3f3fbbd9c39092f4be9eac3e814f7d381533634",
              "issue": 585,
              "expected_issue_updated_at": "2026-10-03T12:57:33Z",
              "expected_issue_comments": 2
            },
            {
              "operation_id": "quittance586-create-20261004-ledger0938",
              "operation": "pull.create",
              "args": {
                "owner": "Quittance-Labs",
                "repo": "Quittance0",
                "base": "main",
                "head": "woahwhattheheck:feat/q586-seller-session-ledger0938",
                "title": "Require signed wallet sessions for seller invoice access",
                "body": "## Why\n\nA public pay link exposes the seller address, so using that address as a workspace credential allowed any link holder to request private customer fields and mint invoices under another wallet. This change makes seller access depend on proof of wallet control and retires the indefinitely reusable cancellation signature.\n\nCloses #586.\n\n## What changes\n\n- Add server-issued SEP-10 challenge and session routes using the existing Stellar SDK. Challenges bind the configured home/API domains, account and pinned network, expire within five minutes and can be redeemed once.\n- Issue HMAC-signed sessions with an environment-selected key ID and a maximum one-hour lifetime. Configuration fails closed and supports overlapping verification keys during rotation.\n- Enforce verified seller identity in the shared invoice router used by all three server modes. List, stats, events, create and cancel require a session; only an owning session receives private invoice fields. A declared seller key that differs from the session returns 403.\n- Use Freighter `signTransaction` for authentication. The browser retains tokens only in memory, invalidates them synchronously on account/network/disconnect changes, aborts stale seller requests and retries one 401 within the original wallet session. Public checkout remains anonymous.\n- Mirror the challenge/session contract in the mock API, allow the Authorization CORS header and migrate existing HTTP fixtures, cancellation callers and smoke scripts to the same contract.\n\nThe additional changed files are existing test fixtures and script callers that previously used an unsigned seller key. No dependency, account-table or database-schema change is required.\n\n## Acceptance coverage\n\n- The named pay-link regression obtains the seller key from the public DTO, repeats the request without a session, and asserts that `customerEmail` is absent.\n- Mounted routes cover anonymous 401 responses, body/query/header identity mismatches, cross-seller access, authenticated creation and cancellation, and the configured-origin Authorization preflight.\n- Real SDK challenges cover invalid signatures, replay, strict expiry, network/domain mismatch, bounded nonce admission and HMAC key rotation.\n- Frontend tests exercise real Axios interception, the Freighter signing boundary, account switches during authentication/fetch, memory-only tokens, cancellation through a session and a single 401 refresh.\n\n## Validation\n\n[Clean cloud run 37204495861](https://github.com/woahwhattheheck/bounty-concierge/actions/runs/37204495861) checked out immutable source `d9322f3f5a11533d46825c2894034e10214a3192` on Ubuntu 24.04, Node 24.21.0 and npm 11.19.0, using the repository's existing commands and unchanged lockfiles:\n\n| Check | Result |\n| --- | --- |\n| Backend `npm ci`, `npm run typecheck`, `npm test` | **911 passed**, 0 failed/cancelled/skipped |\n| Frontend `npm ci`, `npm run lint`, `npm run typecheck`, `npm test` | **770 passed**, 0 failed/cancelled/skipped; lint retains its three existing warnings |\n| Root `node --test \"tests/**/*.test.mjs\"` | **41 passed**, 0 failed/cancelled/skipped |\n\nThe run publishes backend, frontend and shared-test logs as seven-day artifacts. It requires no seller/payer secrets; the optional live Testnet evidence step remains separately secrets-gated.\n\n## Deployment notes\n\nConfigure the dedicated challenge signing key, home/API domains and HMAC key ring described in [docs/SELLER_AUTH.md](docs/SELLER_AUTH.md). Existing seller clients must authenticate; there is no development or legacy-cancel bypass.\n\nChallenge nonces are bounded and process-local. Issuance and redemption must reach the same process for the five-minute exchange; a restart or another process rejects an unknown challenge and requires a fresh one. Session verification is stateless across processes sharing the same domain, network and key ring. Cross-process challenge redemption would require shared atomic nonce storage.\n",
                "draft": false,
                "maintainer_can_modify": true
              },
              "expected_head_sha": "d9322f3f5a11533d46825c2894034e10214a3192",
              "issue": 586,
              "expected_issue_updated_at": "2026-10-03T11:44:02Z",
              "expected_issue_comments": 1
            }
          ];
          const credential = process.env.PUBLISHING_OPERATION_TOKEN;
          const safeCode = value => typeof value === 'string' && /^[a-zA-Z0-9_:-]{1,100}$/.test(value) ? value : null;
          const headers = { Authorization: 'Bearer ' + credential, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', 'User-Agent':'Commons-Shipping-Enforcer/1.0' };
          async function read(path) {
            const response = await fetch('https://api.github.com' + path,{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
            if (!response.ok) { await response.body?.cancel(); throw new Error('github_read_' + response.status); }
            return response.json();
          }
          const emit = observation => console.log(JSON.stringify(observation));
          if (!credential) { emit({outcome:'binding_absent'}); process.exitCode=1; }
          else {
            try {
              const actor = await read('/user');
              if (actor.id !== 293286387 || actor.login !== 'woahwhattheheck') { emit({outcome:'different_account_observed',actor_id:actor.id}); process.exitCode=1; }
              else {
                for (const input of queue) {
                  const observation={schema:'author-publication-observation/v1',operation_id:input.operation_id,actor_id:actor.id,publication_attempted:false};
                  try {
                    const repoPath='/repos/'+input.args.owner+'/'+input.args.repo;
                    const headBranch=input.args.head.split(':').slice(1).join(':');
                    const issue=await read(repoPath+'/issues/'+input.issue);
                    const source=await read('/repos/woahwhattheheck/Quittance0/git/ref/heads/'+headBranch);
                    observation.observed_head=source.object?.sha;
                    const listPath=repoPath+'/pulls?state=all&per_page=100&head='+encodeURIComponent(input.args.head);
                    let existing=await read(listPath);
                    existing=existing.filter(pr=>pr.head?.label===input.args.head);
                    if (existing.length) {
                      const found=existing.length===1?await read(repoPath+'/pulls/'+existing[0].number):null;
                      observation.target_url=found?.html_url;
                      observation.readback_head=found?.head?.sha;
                      observation.body_matches=found?.body===input.args.body;
                      observation.title_matches=found?.title===input.args.title;
                      observation.author_matches=found?.user?.id===293286387;
                      observation.outcome=found && found.head?.sha===input.expected_head_sha && observation.body_matches && observation.title_matches && observation.author_matches ? 'already_published_readback_confirmed':'existing_target_requires_reconciliation';
                      emit(observation);
                      if (observation.outcome!=='already_published_readback_confirmed') break;
                      continue;
                    }
                    if (issue.state!=='open' || issue.assignees?.length || issue.updated_at!==input.expected_issue_updated_at || issue.comments!==input.expected_issue_comments || source.object?.sha!==input.expected_head_sha) {
                      observation.outcome='target_changed_since_preparation';emit(observation);break;
                    }
                    observation.publication_attempted=true;
                    let response, result={};
                    try {
                      response=await fetch('https://account-publisher.tjlabs-publisher.workers.dev/v1/publish',{
                        method:'POST',redirect:'error',signal:AbortSignal.timeout(30000),
                        headers:{Authorization:'Bearer '+credential,Accept:'application/json','Content-Type':'application/json','User-Agent':'Commons-Shipping-Enforcer/1.0'},
                        body:JSON.stringify({operation_id:input.operation_id,operation:input.operation,args:input.args})
                      });
                      observation.publisher_http_status=response.status;
                      const retryAfter=response.headers.get('retry-after');
                      if (retryAfter && /^\d+$/.test(retryAfter)) observation.retry_after_seconds=Number(retryAfter);
                      result=await response.json().catch(()=>({}));
                      observation.publisher_allow=result.allow===true;
                      observation.publisher_error=safeCode(result.error);
                      observation.publisher_reason=safeCode(result.reason_code);
                      observation.publisher_status=safeCode(result.status);
                    } catch { observation.publisher_transport_uncertain=true; }
                    if (observation.publisher_http_status===429) {observation.outcome='provider_cooldown';emit(observation);break;}
                    const afterList=await read(listPath);
                    const candidates=afterList.filter(pr=>pr.head?.label===input.args.head);
                    const found=candidates.length===1?await read(repoPath+'/pulls/'+candidates[0].number):null;
                    observation.target_url=found?.html_url||null;
                    observation.readback_head=found?.head?.sha||null;
                    observation.body_matches=found?.body===input.args.body;
                    observation.title_matches=found?.title===input.args.title;
                    observation.author_matches=found?.user?.id===293286387;
                    observation.outcome=found && found.head?.sha===input.expected_head_sha && observation.body_matches && observation.title_matches && observation.author_matches ? 'published_readback_confirmed':'desired_pr_not_observed';
                    emit(observation);
                    if (observation.outcome!=='published_readback_confirmed') break;
                  } catch(error) {observation.outcome=observation.publication_attempted?'readback_unresolved':'read_failed';observation.read_error=safeCode(error.message);emit(observation);process.exitCode=1;break;}
                }
              }
            } catch(error) {emit({outcome:'read_failed',read_error:safeCode(error.message)});process.exitCode=1;}
          }
          
          JS
