name: main-range-verify

# Preserve range-observer source and manual inputs without scheduled verification.
on:
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: Minutes of main history to coalesce
        required: false
        default: '30'

permissions:
  contents: read

concurrency:
  group: commons-main-range-verify
  cancel-in-progress: false

jobs:
  verify-range:
    # The permanent focused-validation rule retires default repository sweeps.
    # A prior manual dispatch or hosted-CI opt-in does not resume this runner.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep complete ancestry; load file contents only when needed.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: verify one frozen main range
        env:
          DISPATCH_LOOKBACK: ${{ inputs.lookback_minutes }}
        run: |
          lookback="${DISPATCH_LOOKBACK:-30}"
          python3 host/main_range.py \
            --head HEAD \
            --lookback-minutes "$lookback" \
            --receipt "$RUNNER_TEMP/main-range.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: main-range-${{ github.run_id }}
          path: ${{ runner.temp }}/main-range.json
          if-no-files-found: error
