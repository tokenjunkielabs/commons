name: capability-entrypoints

on:
  push:
    branches:
      - main
    paths: &entrypoint_paths
      - '.github/workflows/capability-entrypoints.yml'
      - 'test_capability_entrypoints.py'
      - 'test_chargeable_checkout_eof.py'
      - 'p/grok-build-chargeable-checkout-20260828-01.md'
      - 'index.html'
      - 'resources.html'
      - 'commerce.html'
      - '*.html'
      - 'host/payment_capability.py'
      - 'host/product_lifecycle_guard.py'
      - 'revenue/product_lifecycle/**'
      - 'revenue/agent_failure_autopsy/offer.json'
      - 'revenue/outcome_commerce/manifest.json'
      - 'revenue/outcome_commerce/catalog.json'
      - 'orchestration.html'
      - 'orchestration/jeffersonville/frameworks.json'
      - 'orchestration/jeffersonville/topology.json'
      - 'coordination/connector_preflight/**'
      - 'revenue/mmsd_ai_governance_policy/**'
      - 'revenue/hive_photo_meal_journal/**'
      - 'p/ztk-q4m7-hive019-mealframe-recovery-20260914.md'
      - 'revenue/organization_outbound_lease/**'
      - 'tests/test_organization_outbound_lease.py'
      - 'tests/test_organization_outbound_lease_trust.py'
      - 'revenue/organization_outbound_chain/**'
      - 'tests/test_organization_outbound_chain.py'
  pull_request:
    paths: *entrypoint_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            open_door_guard.py
            open_door_guard_core.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: open-door anti-regression
        run: git show --format= --no-ext-diff HEAD | python open_door_guard.py --diff-file -
      - name: whitespace guard
        run: git diff --check HEAD^

  product-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize trusted lifecycle base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            if [[ -z "${GITHUB_BASE_REF}" ]]; then
              echo "pull_request event missing GITHUB_BASE_REF" >&2
              exit 2
            fi
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            TRUSTED_REF="origin/${GITHUB_BASE_REF}"
          else
            TRUSTED_REF="HEAD^"
          fi
          git rev-parse --verify "${TRUSTED_REF}^{commit}" >/dev/null
          BASE_REGISTRY="${RUNNER_TEMP}/product-lifecycle-base.json"
          if git cat-file -e "${TRUSTED_REF}:revenue/product_lifecycle/registry.json" 2>/dev/null; then
            git show "${TRUSTED_REF}:revenue/product_lifecycle/registry.json" > "${BASE_REGISTRY}"
          else
            printf '%s\n' '{"schema":"commons.product-lifecycle.v1","products":[]}' > "${BASE_REGISTRY}"
          fi
          printf 'PRODUCT_LIFECYCLE_BASE=%s\n' "${BASE_REGISTRY}" >> "${GITHUB_ENV}"
      - name: Active-surface retirement guard
        run: python host/product_lifecycle_guard.py --repo-root . --base-registry "${PRODUCT_LIFECYCLE_BASE}"
