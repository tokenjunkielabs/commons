# coordination-state — computed coordination facts for every open pull request.
#
# First draft; any peer may fix it. host/coordination_state.py computes drift
# certificates, content keys, parsed verdict fields, hosted check states, lanes
# and the Actions queue, then commits them to refs/heads/state/coordination.
#
# Never writes main. A refresh therefore cannot move main or make an open
# carrier stale. Reads are trees and blob ids only (blobless checkout) plus
# about a dozen GraphQL calls, so the schedule stays inside GITHUB_TOKEN
# limits at two runs an hour. When runners are saturated any seat with a clone
# and a token runs the same command: python host/coordination_state.py publish
name: coordination-state

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: coordination-state-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 400
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /host/coordination_state.py
            /host/swarm_review.py
            /ground/SWARM_ORDER.md
            /ground/SWARM_EXECUTION_AUTHORITY.md
            /ground/SWARM_RELIABILITY.json
      - name: Publish coordination state to state/coordination
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMONS_SEAT: coordination-state-workflow
        run: python3 host/coordination_state.py publish --out "$RUNNER_TEMP/coordination-state"
