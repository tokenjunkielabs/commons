name: uiowa-100-operator-portability

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'revenue/uiowa_rfq_18649_operator_portability/**'
      - 'revenue/uiowa_rfq_18649_workshare/*.py'
      - 'revenue/uiowa_rfq_18649_workshare/fixtures/synthetic_packet.json'
      - 'revenue/uiowa_rfq_18649_workshare/fixtures/synthetic_authority.json'
      - 'revenue/uiowa_rfq_18649_workbench/server.py'
      - 'revenue/uiowa_rfq_18649_workbench/index.html'
      - 'revenue/uiowa_rfq_18649_workbench/app.js'
      - 'revenue/uiowa_rfq_18649_workbench/style.css'
      - '.github/workflows/uiowa-100-operator-portability.yml'

permissions:
  contents: read

jobs:
  portable-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /revenue/uiowa_rfq_18649_operator_portability/
            /revenue/uiowa_rfq_18649_workshare/
            /revenue/uiowa_rfq_18649_workbench/
      - name: Build portable kit and execute both operators
        shell: bash
        run: |
          set -euo pipefail
          DIR=revenue/uiowa_rfq_18649_operator_portability
          python3 "$DIR/uiowa100_portability.py" acceptance --root . --revision "$(git rev-parse HEAD)" --out "$RUNNER_TEMP/uiowa100-normal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uiowa100-operator-portability-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/uiowa100-normal/
          if-no-files-found: warn
          retention-days: 30
