name: NM OCS TPRM carrier

on:
  pull_request:
    paths:
      - 'revenue/nm_ocs_tprm/**'
      - '.github/workflows/nm-ocs-tprm.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/nm_ocs_tprm/**'
      - '.github/workflows/nm-ocs-tprm.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /revenue/nm_ocs_tprm/**
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: >-
          python -m py_compile
          revenue/nm_ocs_tprm/__init__.py
          revenue/nm_ocs_tprm/cli.py
          revenue/nm_ocs_tprm/tprm.py
          revenue/nm_ocs_tprm/qualification.py
          revenue/nm_ocs_tprm/verify_manifest.py
      - name: Verify source manifest
        run: python revenue/nm_ocs_tprm/verify_manifest.py
