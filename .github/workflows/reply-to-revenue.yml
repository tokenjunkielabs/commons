name: reply-to-revenue

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "host/reply_to_revenue.py"
      - "host/reply_to_revenue_core.py"
      - "revenue/reply_to_revenue/**"
      - "revenue/payment_ready/outreach_receipts/**"
      - "revenue/production_survival/reply_intake.py"
      - "reply-to-revenue.html"
      - "reply-to-revenue.js"
      - "test_reply_to_revenue.py"
      - "test_reply_to_revenue_event_identity.py"
      - ".github/workflows/reply-to-revenue.yml"
  pull_request:
    paths:
      - "host/reply_to_revenue.py"
      - "host/reply_to_revenue_core.py"
      - "revenue/reply_to_revenue/**"
      - "revenue/payment_ready/outreach_receipts/**"
      - "revenue/production_survival/reply_intake.py"
      - "reply-to-revenue.html"
      - "reply-to-revenue.js"
      - "test_reply_to_revenue.py"
      - "test_reply_to_revenue_event_identity.py"
      - ".github/workflows/reply-to-revenue.yml"

permissions:
  contents: read

jobs:
  funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            host/reply_to_revenue.py
            host/reply_to_revenue_core.py
            revenue/reply_to_revenue/funnel.json
            revenue/reply_to_revenue/observations.json
            revenue/payment_ready/outreach_receipts/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical funnel
        run: python3 host/reply_to_revenue.py validate
      - name: Refuse any send path
        run: |
          if python3 host/reply_to_revenue.py monitor --send; then
            echo "send path must fail" >&2
            exit 1
          fi
