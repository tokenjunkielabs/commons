name: revenue-hardening

on:
  push:
    branches:
      - main
    paths:
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/revenue-hardening.yml'
      - 'carrier.js'
      - 'diagnostic.html'
      - 'host/payment_ready.py'
      - 'host/revenue_recovery.py'
      - 'host/_revenue_recovery_core_20260917.inc'
      - 'opportunities/pinellas_26_0795_rfi_digital_evidence/**'
      - 'p/demon-revenue-hardening-correction-20260825-01.md'
      - 'p/jojo-revenue-recovery-pipeline-20260825-01.md'
      - 'revenue/payment_ready/**'
      - 'revenue/hive/fulfillment-desk/**'
      - 'revenue/hive/intake-crm-workflow/**'
      - 'revenue/cas_actuarial_llm_benchmark/**'
      - 'revenue/commercial_funnel/**'
      - 'test_carrier_from_memory.js'
      - 'test_diagnostic_dlp.js'
      - 'test_dio_crlf.py'
      - 'test_dio_revenue_contract.py'
      - 'test_gitignore_eof.py'
      - 'test_payment_ready.py'
      - 'test_revenue_recovery.py'
      - 'test_revenue_recovery_unicode_nfkc.py'
  pull_request:
    paths:
      - '.gitattributes'
      - '.gitignore'
      - '.github/workflows/revenue-hardening.yml'
      - 'carrier.js'
      - 'diagnostic.html'
      - 'host/payment_ready.py'
      - 'host/revenue_recovery.py'
      - 'host/_revenue_recovery_core_20260917.inc'
      - 'opportunities/pinellas_26_0795_rfi_digital_evidence/**'
      - 'p/demon-revenue-hardening-correction-20260825-01.md'
      - 'p/jojo-revenue-recovery-pipeline-20260825-01.md'
      - 'revenue/payment_ready/**'
      - 'revenue/hive/fulfillment-desk/**'
      - 'revenue/hive/intake-crm-workflow/**'
      - 'revenue/cas_actuarial_llm_benchmark/**'
      - 'revenue/commercial_funnel/**'
      - 'test_carrier_from_memory.js'
      - 'test_diagnostic_dlp.js'
      - 'test_dio_crlf.py'
      - 'test_dio_revenue_contract.py'
      - 'test_gitignore_eof.py'
      - 'test_payment_ready.py'
      - 'test_revenue_recovery.py'
      - 'test_revenue_recovery_unicode_nfkc.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Keep two commits for local diffs; missing event bases are fetched below.
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.gitignore
            /.github/workflows/revenue-hardening.yml
            /carrier.js
            /diagnostic.html
            /package.json
            /open_door_guard.py
            /open_door_guard_core.py
            /host/payment_ready.py
            /host/revenue_recovery.py
            /host/_revenue_recovery_core_20260917.inc
            /revenue/__init__.py
            /revenue/payment_ready/*.json
            /revenue/cas_actuarial_llm_benchmark/
            /revenue/commercial_funnel/
            /revenue/hive/fulfillment-desk/bundle.py
            /revenue/hive/fulfillment-desk/run_bundle.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: detect revenue measurement delta against event base
        id: contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch)
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          zero='0000000000000000000000000000000000000000'
          paths=(
            .github/workflows/revenue-hardening.yml
            .gitattributes
            .gitignore
            carrier.js
            diagnostic.html
            host/payment_ready.py
            host/revenue_recovery.py
            host/_revenue_recovery_core_20260917.inc
            p/demon-revenue-hardening-correction-20260825-01.md
            p/jojo-revenue-recovery-pipeline-20260825-01.md
            revenue/payment_ready
            test_carrier_from_memory.js
            test_diagnostic_dlp.js
            test_dio_crlf.py
            test_dio_revenue_contract.py
            test_gitignore_eof.py
            test_payment_ready.py
            test_revenue_recovery.py
            test_revenue_recovery_unicode_nfkc.py
          )
          # A missing event base needs one commit, not repository history.
          if [ -n "$base" ] && [ "$base" != "$zero" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 --filter=blob:none origin "$base" || true
          fi
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- "${paths[@]}"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: CAS actuarial benchmark reproducibility core
        run: |
          python -m py_compile \
            revenue/cas_actuarial_llm_benchmark/_schema.py \
            revenue/cas_actuarial_llm_benchmark/core.py \
            revenue/cas_actuarial_llm_benchmark/fixture.py \
            revenue/cas_actuarial_llm_benchmark/cli.py
          snapshot="${RUNNER_TEMP}/cas-benchmark-snapshot.json"
          python -m revenue.cas_actuarial_llm_benchmark.cli fixture --output "${snapshot}"
          python -m revenue.cas_actuarial_llm_benchmark.cli verify "${snapshot}"
      - name: Commercial funnel source
        run: |
          python -m py_compile \
            revenue/commercial_funnel/common.py \
            revenue/commercial_funnel/events.py \
            revenue/commercial_funnel/model.py \
            revenue/commercial_funnel/ledger.py \
            revenue/commercial_funnel/cli.py
      - name: Parcel product source
        working-directory: revenue/hive/fulfillment-desk
        run: python -m py_compile bundle.py run_bundle.py
      - name: deterministic revenue measurement
        if: steps.contract.outputs.changed == 'true'
        run: python host/revenue_recovery.py measure
      - name: syntax and JSON checks
        if: steps.contract.outputs.changed == 'true'
        run: |
          python -m py_compile host/revenue_recovery.py host/_revenue_recovery_core_20260917.inc host/payment_ready.py
          node --check carrier.js
          python -c "import json,pathlib; [json.loads(path.read_text(encoding='utf-8')) for path in pathlib.Path('revenue/payment_ready').glob('*.json')]"
      - name: no admission lock in the landed commit
        run: git show --format= --no-ext-diff HEAD | python open_door_guard.py --diff-file -
      - name: whitespace guard
        run: git diff --check HEAD^

  pinellas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Keep two commits for local diffs; missing event bases are fetched below.
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.gitignore
            /.github/workflows/revenue-hardening.yml
            /opportunities/pinellas_26_0795_rfi_digital_evidence/custody_reference.py
            /opportunities/pinellas_26_0795_rfi_digital_evidence/gate_requirements.json
            /opportunities/pinellas_26_0795_rfi_digital_evidence/gate_evidence.json
            /tools/proposal_gate/proposal_gate.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: detect Pinellas carrier delta against event base
        id: delta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch)
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          zero='0000000000000000000000000000000000000000'
          # A missing event base needs one commit, not repository history.
          if [ -n "$base" ] && [ "$base" != "$zero" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 --filter=blob:none origin "$base" || true
          fi
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" HEAD -- .github/workflows/revenue-hardening.yml opportunities/pinellas_26_0795_rfi_digital_evidence; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Pinellas 26-0795 digital-evidence carrier
        if: steps.delta.outputs.changed == 'true'
        run: |
          set -eu
          cd opportunities/pinellas_26_0795_rfi_digital_evidence
          python -m py_compile custody_reference.py
          set +e
          python ../../tools/proposal_gate/proposal_gate.py gate_requirements.json gate_evidence.json --check > /tmp/pinellas-gate.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          data=json.load(open('/tmp/pinellas-gate.json'))
          assert data['submission_ready'] is False, data
          assert set(data['blocking_requirements']) == {'GATE-SOURCE','GATE-ROUTE','GATE-ORG','GATE-ATTEST','GATE-OWNER'}, data
          PY
