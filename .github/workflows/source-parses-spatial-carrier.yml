name: titan-final-spatial-carrier

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titan-final-spatial-carrier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  titan-final-spatial-carrier:
    name: titan-final-spatial-carrier
    # Kaggriculture is owner-stopped. Keep source and manual workflow metadata;
    # only Bryce's explicit resume authorizes a change to this pause.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: revenue/kaggriculture/cloud-execution-lab/candidates/v4/repairs/runtime/final-spatial-guard
    steps:
      - name: Check out exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact candidate outside checkout and verify inputs unchanged
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import tempfile
          import apply_repair as carrier
          root = Path(os.environ['GITHUB_WORKSPACE'])
          before = carrier.validate_sources(root)
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as tmp:
              output = Path(tmp) / 'main.py'
              receipt = Path(tmp) / 'receipt.json'
              result = carrier.materialize(root, output, receipt_path=receipt)
              if result['candidate_git_blob_sha1'] != 'bb3a044aedefa36dcdc5d933ca396fefbf1d9fdd':
                  raise SystemExit('candidate semantics changed')
              if result['candidate_bytes'] != 30367:
                  raise SystemExit('candidate byte count changed')
              if json.loads(receipt.read_text()) != result:
                  raise SystemExit('receipt differs from returned result')
              compile(output.read_bytes(), str(output), 'exec')
              if carrier.validate_sources(root) != before:
                  raise SystemExit('canonical inputs changed')
              print(json.dumps(result, sort_keys=True))
          PY
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- \
            revenue/kaggriculture/cloud-execution-lab/main.py \
            revenue/kaggriculture/cloud-execution-lab/spatial_tempo.py
