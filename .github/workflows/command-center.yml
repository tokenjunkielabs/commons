name: command-center
on:
  push:
    branches: [main]
    
    paths: ['integrations/command_center/**', 'integrations/shared_equipment/services.py', 'command.html', '.github/workflows/command-center.yml']
  pull_request:
    paths: ['integrations/command_center/**', 'integrations/shared_equipment/services.py', 'command.html', '.github/workflows/command-center.yml']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: command-center-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            /.gitattributes
            /open_door_guard.py
            /open_door_guard_core.py
            /package.json
            /integrations/package.json
            /integrations/command_center/package.json
            /integrations/command_center/web/package.json
            /integrations/command_center/web/app.js
            /integrations/command_center/web/work.js
            /integrations/command_center/web/deathstar.js
            /integrations/command_center/web/mail.js
          sparse-checkout-cone-mode: false
      - name: Existing Commons admission contract
        run: python3 open_door_guard.py --diff HEAD^ HEAD
      - name: Browser source syntax
        run: |
          node --check integrations/command_center/web/app.js
          node --check integrations/command_center/web/work.js
          node --check integrations/command_center/web/deathstar.js
          node --check integrations/command_center/web/mail.js
